server:
  port: 8080

spring:
  application:
    name: gateway
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.hibernate.Driver
    username: root
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  cloud:
    gateway:
      routes:
        - id: validaciones-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/**